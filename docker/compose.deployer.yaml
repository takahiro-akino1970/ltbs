name: ltbs-deployer

services:
  deployer:
    build:
      context: ./deployer
      args:
        LOCAL_UID: ${LOCAL_UID:-1000}
        LOCAL_GID: ${LOCAL_GID:-1000}
    init: true
    volumes:
      - ../deploy:/workspace/deploy
      - type: bind
        source: ${DEPLOY_SSH_DIR:-${HOME}/.ssh}
        target: /home/deployer/.ssh
        read_only: true
        bind:
          create_host_path: false
