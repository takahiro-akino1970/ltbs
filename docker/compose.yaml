name: ltbs

services:
  app:
    build:
      context: .
      target: app
      args:
        LOCAL_UID: ${LOCAL_UID:-1000}
        LOCAL_GID: ${LOCAL_GID:-1000}
    init: true
    environment:
      APP_URL: http://localhost:${APP_PORT:-8000}
      DB_CONNECTION: mariadb
      DB_URL: ""
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_DATABASE: ${MARIADB_DATABASE:-ltbs}
      DB_USERNAME: ${MARIADB_USER:-ltbs}
      DB_PASSWORD: ${MARIADB_PASSWORD:?Set MARIADB_PASSWORD in docker/.env}
    volumes:
      - ../src:/app
    #  - vendor:/app/vendor
    depends_on:
      mariadb:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - "SCRIPT_NAME=/fpm-ping SCRIPT_FILENAME=/fpm-ping REQUEST_METHOD=GET cgi-fcgi -bind -connect 127.0.0.1:9000 | grep -q pong"
      interval: 10s
      timeout: 5s
      start_period: 180s
      retries: 5

  mariadb:
    image: ltbs-mariadb:11.4
    build:
      context: .
      dockerfile: Dockerfile
      target: mariadb
    environment:
      MARIADB_DATABASE: ${MARIADB_DATABASE:-ltbs}
      MARIADB_USER: ${MARIADB_USER:-ltbs}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:?Set MARIADB_PASSWORD in docker/.env}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?Set MARIADB_ROOT_PASSWORD in docker/.env}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./sql:/ddl:ro
    healthcheck:
      test:
        - CMD
        - healthcheck.sh
        - --connect
        - --innodb_initialized
      interval: 10s
      timeout: 5s
      start_period: 120s
      retries: 10

  nginx:
    image: nginxinc/nginx-unprivileged:stable-alpine
    init: true
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8080"
    volumes:
      - ../src/public:/app/public:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - -O
        - /dev/null
        - http://127.0.0.1:8080/up
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 5

  vite:
    build:
      context: .
      target: frontend
      args:
        LOCAL_UID: ${LOCAL_UID:-1000}
        LOCAL_GID: ${LOCAL_GID:-1000}
    init: true
    ports:
      - "127.0.0.1:${VITE_PORT:-5173}:${VITE_PORT:-5173}"
    environment:
      APP_URL: http://localhost:${APP_PORT:-8000}
      VITE_PORT: ${VITE_PORT:-5173}
    volumes:
      - ../src:/app
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:' + process.env.VITE_PORT + '/@vite/client').then(r => process.exit(r.ok ? 0 : 1)).catch(e => { console.error(e); process.exit(1); })"
      interval: 10s
      timeout: 5s
      start_period: 120s
      retries: 5

volumes:
  vendor:
  mariadb_data:
  mysql_data:
